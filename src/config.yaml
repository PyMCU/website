site:
  name: PyMCU
  site: 'https://pymcu.org'
  base: '/'
  trailingSlash: false

  # Vacio a proposito. Aqui venia el id de verificacion de la plantilla AstroWind,
  # que no es nuestro: una etiqueta de verificacion concede acceso a los datos de
  # Search Console a quien posea ese id, asi que publicar el de un tercero sobre
  # tu propio dominio no es solo inutil, es regalarle una llave. Si algun dia hace
  # falta verificar por meta, poner AQUI el id propio de Search Console.
  googleSiteVerificationId: ''

metadata:
  title:
    default: PyMCU
    template: '%s — PyMCU'
  description: 'PyMCU — A free, deterministic AOT compiler for microcontrollers. Write firmware in a statically-typed subset of Python for bare-metal performance with zero runtime overhead.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: PyMCU
    images:
      - url: '~/assets/images/pymcu-og.png'
        width: 1200
        height: 630
    type: website
  twitter:
    # Sin handle: los que habia, '@arthelokyo', son del autor de la plantilla
    # AstroWind, no de PyMCU, y atribuian cada tarjeta compartida a un tercero.
    # Poner aqui la cuenta propia el dia que exista.
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
