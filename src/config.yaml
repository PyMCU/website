site:
  name: PyMCU
  site: 'https://pymcu.org'
  base: '/'
  # true = los canonicals y enlaces internos llevan barra final, igual que la URL
  # que sirve el hosting (la variante sin barra responde 307 hacia la con barra).
  trailingSlash: true

  # Vacio A PROPOSITO: el dominio esta verificado en Search Console por DNS, que
  # cubre todo el dominio y sobrevive a cualquier cambio de plantilla. NO reponer
  # una etiqueta aqui: la que traia AstroWind era el id de un tercero, y una
  # etiqueta de verificacion concede acceso a los datos de Search Console a quien
  # posea ese id.
  googleSiteVerificationId: ''

metadata:
  title:
    default: PyMCU
    template: '%s — PyMCU'
  description: 'PyMCU — A free, deterministic AOT compiler for microcontrollers. Write firmware in a statically-typed subset of Python for bare-metal performance with zero runtime overhead.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: PyMCU
    images:
      - url: '~/assets/images/pymcu-og.png'
        width: 1200
        height: 630
    type: website
  twitter:
    # Cuenta propia. Los valores que traia la plantilla, '@arthelokyo', eran del
    # autor de AstroWind y atribuian a un tercero cada tarjeta compartida.
    handle: '@begeistert_'
    site: '@begeistert_'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
